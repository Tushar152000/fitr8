name: CI/CD

# The one pipeline (2026-11-27: replaces ci.yml, deploy.yml and mobile-release.yml).
#
# Every pull request and push: checks (format, Prisma, migration drift, lint/typecheck/test/build,
# workflow + shell lint); pull requests also build the Docker images.
# Push to main (and a manual run on main): after the checks pass, deploy in order
# images → database migrations → API (Cloud Run, smoke-tested) → web (Vercel) and app OTA update.
# Each step starts only when the one before succeeded, so clients never call an API that isn't live.
# Only services whose code changed since the last fully successful deploy are deployed (`changes`);
# a manual run with "Deploy everything" ships all of them.
# Manual run with "Store build": a new native build on EAS (optionally submitted to the stores).
#
# Everything environment-specific is a repository variable or secret; nothing here needs editing.
# The full list, and the one-time setup that fills it in, is docs/RELEASE.md (infra/gcp/setup.sh sets
# the GCP variables; infra/release-check.sh verifies all of it).
# GitHub signs in to Google with OIDC (Workload Identity Federation): no service account keys.
# App secrets live only in Secret Manager and are mounted by name: never stored in GitHub or logged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy (main only) what changed since the last successful deploy
        type: boolean
        default: true
      deploy_all:
        description: Deploy every service, changed or not
        type: boolean
        default: false
      store_build:
        description: Store build on EAS (needed when native code changed; bump `version` in apps/mobile/app.json first)
        type: choice
        options: [none, all, ios, android]
        default: none
      store_profile:
        description: Store build profile (eas.json)
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: Submit the store build to App Store Connect / Google Play when done (production only)
        type: boolean
        default: false

# Pull requests: a newer push cancels the older run. main: runs queue, so deploys never overlap.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHA: ${{ github.sha }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fitlens

jobs:
  # ─── Checks ──────────────────────────────────────────────────────────────────────────────────
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitlens
          POSTGRES_PASSWORD: fitlens
          POSTGRES_DB: fitlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitlens" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # e2e tests create/migrate/seed this database themselves
      TEST_DATABASE_URL: postgresql://fitlens:fitlens@localhost:5432/fitlens_test?schema=public
      DATABASE_URL: postgresql://fitlens:fitlens@localhost:5432/fitlens?schema=public
      # Scratch database for the migration drift check (Prisma may wipe it).
      SHADOW_DATABASE_URL: postgresql://fitlens:fitlens@localhost:5432/fitlens_shadow?schema=public
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Prisma schema
        run: pnpm --filter @fitr8/db exec prisma validate

      # Fails when schema.prisma changed without a migration (or a migration was edited by hand):
      # production would otherwise run code against a database that doesn't match it.
      - name: Migrations match the schema
        run: |
          PGPASSWORD=fitlens psql -h localhost -U fitlens -d fitlens -c "CREATE DATABASE fitlens_shadow"
          pnpm db:drift

      - name: Lint, typecheck, test, build (all workspaces)
        run: pnpm turbo run lint typecheck test build --cache-dir=.turbo

      - name: Repo scripts (local bootstrap helpers)
        run: pnpm test:scripts

  workflows:
    name: Workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # actionlint also runs shellcheck on every `run:` script.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: shellcheck (infra scripts)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 infra/gcp/*.sh infra/*.sh

  # Pull requests only: catches a broken Dockerfile before merge (main builds and pushes the real
  # images in `api-images`).
  docker:
    name: Docker images build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          build-args: ${{ matrix.app == 'web' && 'NEXT_PUBLIC_API_URL=https://api.fitr8.com' || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Deploy (main) ───────────────────────────────────────────────────────────────────────────
  # What changed since the last deploy that fully succeeded? A failed or partial deploy doesn't count,
  # so anything it didn't ship is compared again next time. Shared packages and the lockfile count for
  # every service that uses them; a change to this workflow redeploys the API and the web.
  changes:
    name: "Deploy: what changed"
    needs: [check, workflows]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.deploy_all || false }}
        run: |
          # The last fully successful run on main that deployed (a push, or a manual run on main).
          prev="$(gh run list --repo "${{ github.repository }}" --workflow ci-cd.yml --branch main \
            --status success --limit 20 --json headSha,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].headSha // empty')"
          everything=false
          if [ "$ALL" = true ]; then
            echo "Deploying everything (requested)"; everything=true
          elif [ -z "$prev" ] || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "No earlier successful deploy to compare with: deploying everything"; everything=true
          else
            echo "Changes since $prev:"; git diff --stat "$prev" "$SHA" | tail -n 1
          fi
          changed() { [ "$everything" = true ] || ! git diff --quiet "$prev" "$SHA" -- "$@"; }
          shared=(packages/domain packages/contracts packages/tsconfig pnpm-lock.yaml package.json turbo.json)
          api=false web=false app=false
          changed apps/api packages/db "${shared[@]}" .github/workflows/ci-cd.yml && api=true
          changed apps/web "${shared[@]}" .github/workflows/ci-cd.yml && web=true
          changed apps/mobile packages/contracts && app=true
          echo "api=$api web=$web app=$app" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "api=$api"; echo "web=$web"; echo "app=$app"; } >> "$GITHUB_OUTPUT"

  api-images:
    name: "Deploy: API images"
    needs: changes
    if: ${{ vars.GCP_PROJECT_ID != '' && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfile, two targets: the API runtime and the `prisma migrate deploy` release step.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }},${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/migrate:${{ env.SHA }}
          cache-from: type=gha,scope=api

  migrate:
    name: "Deploy: database migrations"
    needs: api-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production-migrate
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # Runs inside Google next to the database (Cloud SQL socket), so the database has no public access.
      # Seeding foods/exercises is a separate, manual step (docs/RELEASE.md).
      - name: prisma migrate deploy
        run: >-
          gcloud run jobs deploy fitlens-migrate
          --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}"
          --image="${{ env.REGISTRY }}/migrate:${{ env.SHA }}"
          --service-account="${{ vars.GCP_RUNTIME_SA }}"
          --set-cloudsql-instances="${{ vars.GCP_SQL_CONNECTION }}"
          --set-secrets=DATABASE_URL=DATABASE_URL:latest
          --max-retries=0 --task-timeout=10m
          --execute-now --wait

  api:
    name: "Deploy: API (Cloud Run)"
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      # Optional features are switched on by repository variables, and their secrets must exist in
      # Secret Manager first (infra/gcp/setup.sh creates them). The API refuses to boot on a half
      # configuration, so a mistake here fails the deploy instead of shipping.
      - name: Build the service configuration
        id: config
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          REVENUECAT: ${{ vars.REVENUECAT_ENABLED }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          # A repository variable, or a secret of the same name (either works).
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
        run: |
          envs="APP_ENV=production,APP_ROLE=api,DATABASE_POOL_MAX=5,AI_PROVIDER=$AI_PROVIDER"
          envs+=",PUBLIC_URL=${{ vars.PUBLIC_URL }},API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}"
          envs+=",AUTH_COOKIE_DOMAIN=${{ vars.AUTH_COOKIE_DOMAIN }}"
          envs+=",S3_REGION=auto,S3_BUCKET=${{ vars.S3_BUCKET }},S3_FORCE_PATH_STYLE=true"

          secrets="DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest"
          secrets+=",AUTH_GOOGLE_ID=AUTH_GOOGLE_ID:latest,AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest"
          secrets+=",S3_ENDPOINT=S3_ENDPOINT:latest,S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest"
          secrets+=",S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest"
          if [ "$AI_PROVIDER" = anthropic ]; then
            secrets+=",ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
          else
            secrets+=",OPENAI_API_KEY=OPENAI_API_KEY:latest"
          fi
          if [ -n "$APPLE_CLIENT_ID" ]; then
            envs+=",APPLE_CLIENT_ID=$APPLE_CLIENT_ID"
            secrets+=",APPLE_TEAM_ID=APPLE_TEAM_ID:latest,APPLE_KEY_ID=APPLE_KEY_ID:latest"
            secrets+=",APPLE_PRIVATE_KEY=APPLE_PRIVATE_KEY:latest"
          fi
          if [ "$REVENUECAT" = true ]; then
            secrets+=",REVENUECAT_WEBHOOK_AUTH=REVENUECAT_WEBHOOK_AUTH:latest"
            secrets+=",REVENUECAT_SECRET_KEY=REVENUECAT_SECRET_KEY:latest"
          fi
          # Website contact form email (Gmail SMTP with an app password).
          if [ -n "$SMTP_USER" ]; then
            envs+=",SMTP_HOST=$SMTP_HOST,SMTP_USER=$SMTP_USER"
            secrets+=",SMTP_PASS=SMTP_PASS:latest"
          fi
          # /admin's first admins (docs/ADMIN.md). Commas become ";" because commas separate this
          # list; the API accepts either. Unset: the service keeps whatever value it already has.
          if [ -n "$ADMIN_EMAILS" ]; then
            admins="$(printf '%s' "$ADMIN_EMAILS" | tr -s ', ' ';;' | sed 's/^;//; s/;$//')"
            envs+=",ADMIN_EMAILS=$admins"
          fi
          {
            echo "envs=$envs"
            echo "secrets=$secrets"
          } >> "$GITHUB_OUTPUT"

      # db-f1-micro allows 25 connections; a dedicated-core tier (setup.sh default) allows far more:
      # DATABASE_POOL_MAX (5) × max instances stays well inside either, leaving room for migrations.
      # min-instances ≥ 1 keeps one instance warm (no cold start on the first meal scan); cpu-boost
      # speeds up the starts that still happen.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy fitlens-api
          --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}"
          --image="${{ env.REGISTRY }}/api:${{ env.SHA }}"
          --service-account="${{ vars.GCP_RUNTIME_SA }}"
          --allow-unauthenticated
          --port=4000 --cpu=1 --memory=512Mi --concurrency=40 --timeout=300
          --min-instances="${{ vars.API_MIN_INSTANCES || '1' }}"
          --max-instances="${{ vars.API_MAX_INSTANCES || '3' }}"
          --cpu-boost
          --set-cloudsql-instances="${{ vars.GCP_SQL_CONNECTION }}"
          --startup-probe=httpGet.path=/api/health/live,periodSeconds=2,failureThreshold=15
          --liveness-probe=httpGet.path=/api/health/live,periodSeconds=30
          --update-env-vars="${{ steps.config.outputs.envs }}"
          --update-secrets="${{ steps.config.outputs.secrets }}"

      - name: Smoke test
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          url="$(gcloud run services describe fitlens-api --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          curl -fsS --retry 5 --retry-all-errors "$url/api/health"
          echo
          if [ -n "$API_PUBLIC_URL" ]; then
            # Through the load balancer and certificate the clients use.
            curl -fsS --retry 5 --retry-all-errors "$API_PUBLIC_URL/api/health"
            echo
          fi
          echo "API: ${API_PUBLIC_URL:-$url}" >> "$GITHUB_STEP_SUMMARY"

  # After the API, so new pages never call endpoints that aren't live yet. Vercel's own Git
  # deployments for main are off (apps/web/vercel.json); this job is the production web deploy.
  web:
    name: "Deploy: web (Vercel)"
    needs: [changes, api-images, migrate, api]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: env.HAS_VERCEL == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_VERCEL == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Builds here with the project's Vercel settings and env (NEXT_PUBLIC_API_URL), then uploads.
      - name: Deploy to Vercel (production)
        if: env.HAS_VERCEL == 'true'
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Web: $url" >> "$GITHUB_STEP_SUMMARY"

      # Without a Vercel token: the container image path (any host that runs a Docker image).
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_VERCEL != 'true'
      - uses: docker/login-action@v3
        if: env.HAS_VERCEL != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.HAS_VERCEL != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: env.HAS_VERCEL != 'true'
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trigger deploy hook
        if: env.HAS_VERCEL != 'true'
        env:
          WEB_HOOK: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$WEB_HOOK" ]; then curl -fsS -X POST "$WEB_HOOK" && echo "Web deploy triggered"
          else echo "::warning::No VERCEL_TOKEN or WEB_DEPLOY_HOOK_URL: the web was built but not deployed"; fi

  # Over-the-air JS update for installed app builds, after the API they call is live (or unchanged).
  # Only when app code changed since the last successful deploy (`changes`). Native changes need a new
  # store build instead (`store-build` below, after bumping `version` in apps/mobile/app.json).
  # Depends on the API only: the app never calls the web, so a web (Vercel) failure must not hold back
  # phone updates.
  app-update:
    name: "Deploy: app OTA update (${{ matrix.channel }})"
    needs: [changes, api]
    if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    strategy:
      matrix:
        channel: [preview, production]
    steps:
      - uses: actions/checkout@v4

      - name: Expo token
        id: changed
        run: |
          if [ "$HAS_EXPO" = true ]; then echo "app=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No EXPO_TOKEN secret: skipping the OTA update"; echo "app=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.app == 'true'
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.app == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        if: steps.changed.outputs.app == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.changed.outputs.app == 'true'
        run: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@fitr8/contracts

      # --environment loads the EAS environment variables (RevenueCat keys, API URL) into the bundle,
      # exactly as a store build of that profile would. The commit message goes in through env, never
      # pasted into the script (quotes broke it; inlined text is a script-injection risk).
      - name: Publish update
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: >-
          eas update --channel ${{ matrix.channel }} --environment ${{ matrix.channel }}
          --message "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" --non-interactive

  # ─── Store build (manual) ────────────────────────────────────────────────────────────────────
  # New native app builds on EAS, optionally sent to App Store Connect / Google Play when done.
  # Run from Actions → CI/CD → Run workflow → "Store build". Needed when native code changed (a new
  # Expo module, permission or SDK): bump `version` in apps/mobile/app.json first, since OTA updates
  # only reach builds with the same runtime version. Needs: secret EXPO_TOKEN; EAS environment
  # variables per profile (EXPO_PUBLIC_REVENUECAT_*); store credentials and submit settings in EAS.
  store-build:
    name: "Store build (${{ inputs.store_build }}, ${{ inputs.store_profile }})"
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_build != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: store-build-${{ inputs.store_profile }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # Builds run on EAS servers; --no-wait returns once queued (follow it on expo.dev). With
      # --auto-submit, EAS submits the finished build using the submit profile of the same name.
      - name: Queue EAS build
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.store_build }}
          PROFILE: ${{ inputs.store_profile }}
          SUBMIT: ${{ inputs.submit && inputs.store_profile == 'production' }}
        run: |
          args=(--platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$SUBMIT" = true ]; then args+=(--auto-submit); fi
          eas build "${args[@]}"
